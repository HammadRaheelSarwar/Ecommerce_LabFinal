<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Available - Premium Shop</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Use Google Sans alternative (Inter/Roboto) for the Google look -->
    <link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#1A73E8", // Google Blue
                        "secondary": "#EA4335", // Google Red
                        "tertiary": "#FBBC05", // Google Yellow
                        "success": "#34A853", // Google Green
                        
                        // Surface colors (Light/Dark via CSS Variables)
                        "background": "var(--color-background)",
                        "surface": "var(--color-surface)",
                        "surface-container-lowest": "var(--color-background)",
                        "surface-container-low": "var(--color-surface-container-low)",
                        "surface-container": "var(--color-surface-container)",
                        "surface-container-high": "var(--color-surface-container-high)",
                        "surface-container-highest": "var(--color-surface-container-highest)",
                        
                        // Text colors
                        "on-background": "var(--color-on-background)",
                        "on-surface": "var(--color-on-surface)",
                        "on-surface-variant": "var(--color-on-surface-variant)",
                        
                        // On-brand colors
                        "on-primary": "#FFFFFF",
                        "on-secondary": "#FFFFFF",
                        
                        // Outlines
                        "outline": "var(--color-outline)",
                        "outline-variant": "var(--color-outline-variant)",
                        
                        "error": "#D93025",
                        "on-error": "#FFFFFF",
                    },
                    "borderRadius": {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "section-gap": "80px",
                        "margin-desktop": "64px",
                        "gutter": "24px",
                        "base": "8px",
                        "container-max": "1280px"
                    },
                    "fontFamily": {
                        "headline-lg": ["'Google Sans'", "'Product Sans'", "Inter", "sans-serif"],
                        "label-caps": ["'Google Sans'", "Inter", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"],
                        "display-xl": ["'Google Sans'", "Inter", "sans-serif"],
                        "headline-md": ["'Google Sans'", "Inter", "sans-serif"],
                        "button": ["'Google Sans'", "Inter", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "headline-sm": ["'Google Sans'", "Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "headline-lg": ["40px", {"lineHeight": "48px", "fontWeight": "400"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "display-xl": ["64px", {"lineHeight": "76px", "fontWeight": "400"}],
                        "headline-md": ["28px", {"lineHeight": "36px", "fontWeight": "400"}],
                        "button": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "500"}]
                    },
                    "boxShadow": {
                      "google": "0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15)",
                      "google-hover": "0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15)",
                    }
                }
            }
        }
    </script>
  </head>
  <body class="bg-background text-on-background font-body-md min-h-screen flex flex-col selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
